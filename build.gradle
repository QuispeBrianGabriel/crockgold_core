plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.11.0'
	id 'net.ltgt.errorprone' version '5.2.0'
}

group = 'com.crockgold'
apply from: 'gradle/release.gradle'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	errorprone 'com.google.errorprone:error_prone_core:2.52.0'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy 'jacocoTestReport'
}

tasks.named('jacocoTestReport') {
	reports {
		csv.required = true
	}
	// Resumen de cobertura sin servicios externos: consola y, en CI, el summary del job.
	def csvReport = reports.csv.outputLocation
	doLast {
		def totals = [INSTRUCTION: [0, 0], BRANCH: [0, 0], LINE: [0, 0]]
		def rows = csvReport.get().asFile.readLines()
		def header = rows.head().split(',').toList()
		rows.tail().each { row ->
			def cols = row.split(',')
			totals.each { name, t ->
				t[0] += cols[header.indexOf(name + '_COVERED')] as int
				t[1] += cols[header.indexOf(name + '_MISSED')] as int
			}
		}
		def pct = { t -> t[0] + t[1] == 0 ? 'n/a' : String.format(Locale.ROOT, '%.1f%%', 100.0d * t[0] / (t[0] + t[1])) }
		def labels = [INSTRUCTION: 'Instrucciones', BRANCH: 'Ramas', LINE: 'Líneas']
		logger.lifecycle('Cobertura: ' + totals.collect { name, t -> "${labels[name]} ${pct(t)}" }.join(' | '))
		def summary = System.getenv('GITHUB_STEP_SUMMARY')
		if (summary) {
			new File(summary) << '### Cobertura (JaCoCo)\n\n| Métrica | Cobertura | Cubiertas | Total |\n|---|---:|---:|---:|\n' +
				totals.collect { name, t -> "| ${labels[name]} | ${pct(t)} | ${t[0]} | ${t[0] + t[1]} |" }.join('\n') + '\n'
		}
	}
}

tasks.named('jacocoTestCoverageVerification') {
	violationRules {
		rule {
			limit {
				minimum = 0.0
			}
		}
	}
}

tasks.named('check') {
	dependsOn 'jacocoTestCoverageVerification'
}

spotless {
	java {
		palantirJavaFormat()
		formatAnnotations()
	}
}

tasks.withType(JavaCompile).configureEach {
	options.errorprone.disableWarningsInGeneratedCode = true
}
