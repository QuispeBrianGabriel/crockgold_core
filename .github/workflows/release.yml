name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  PRERELEASE: ${{ contains(github.ref_name, '-') }}

jobs:
  verify:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::El tag ${GITHUB_REF_NAME} no apunta a un commit de main."
            exit 1
          fi

  check:
    name: Quality gate
    needs: verify
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: write
      pull-requests: write

  image:
    name: Build & publish image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - id: vars
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Crockgold Core
            org.opencontainers.image.description=Motor contable para economías virtuales
            org.opencontainers.image.vendor=Crockgold
          annotations: |
            org.opencontainers.image.title=Crockgold Core
            org.opencontainers.image.description=Motor contable para economías virtuales
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.vars.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub Release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERIFY=""
          if [[ "$PRIVATE" != "true" ]]; then
            VERIFY="Verificar procedencia: \`gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY}\`"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            $([[ "$PRERELEASE" == "true" ]] && echo --prerelease || echo --latest) \
            --notes "$(cat <<EOF
          ## Imagen Docker

          \`\`\`
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          | | |
          |---|---|
          | Digest | \`${DIGEST}\` |
          | Commit | ${GITHUB_SHA} |
          | Tags | \`${VERSION}\`$([[ "$PRERELEASE" == "true" ]] || echo ', `latest`') |

          ${VERIFY}
          EOF
          )"
